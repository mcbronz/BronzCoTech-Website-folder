<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BronzCoTech | Computer Hardware. Technical Solutions. Built to Work.</title>
<meta name="description" content="BronzCoTech sources quality computer and laptop parts and provides professional repairs, networking configuration, and technical support for individuals and businesses.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">

<style>
  :root {
    --black: #000;
    --gold-hi: #f7e0a0;
    --gold: #d9ac45;
    --gold-lo: #a97a22;
    --gold-deep: #4a3410;
    --silver-hi: #ffffff;
    --silver-lo: #9aa0a6;
    --text: #e8e2d2;
    --font: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--black); }

  /* ---------- Hero shell ---------- */
  .hero {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(3rem, 8vw, 6rem) clamp(1.25rem, 5vw, 3rem);
    background:
      radial-gradient(ellipse 60% 45% at 50% 42%, rgba(217, 172, 69, 0.07), transparent 70%),
      var(--black);
    color: var(--text);
    font-family: var(--font);
    text-align: center;
  }

  .hero__content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 62rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Logo (with built-in mirror reflection) ---------- */
  .logo {
    margin: 0 0 clamp(0.25rem, 1.5vw, 1rem);
    line-height: 0;
  }
  .logo img {
    display: block;
    width: clamp(13rem, 34vw, 25rem);
    height: auto;
  }

  /* ---------- Headline ---------- */
  .hero h1 {
    margin: 0;
    font-weight: 800;
    font-size: clamp(2.1rem, 6.4vw, 4.75rem);
    line-height: 1.08;
    letter-spacing: -0.015em;
    filter: drop-shadow(0 2px 18px rgba(217, 172, 69, 0.18));
  }
  .hero h1 span {
    display: block;
    background-image: linear-gradient(
      180deg,
      var(--gold-hi) 0%,
      var(--gold) 48%,
      var(--gold-lo) 78%,
      #e9c467 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* ---------- Supporting copy ---------- */
  .hero__lead {
    max-width: 40rem;
    margin: clamp(1.5rem, 3.5vw, 2.25rem) 0 0;
    font-size: clamp(0.98rem, 1.5vw, 1.1rem);
    font-weight: 400;
    line-height: 1.65;
    color: var(--text);
  }

  /* ---------- Buttons ---------- */
  .hero__actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
    margin-top: clamp(1.75rem, 4vw, 2.75rem);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 3rem;
    padding: 0.75rem 1.75rem;
    border-radius: 0.5rem;
    font: inherit;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:focus-visible {
    outline: 3px solid var(--gold-hi);
    outline-offset: 3px;
  }
  .btn--primary {
    color: var(--gold-hi);
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, #2c1f08 0%, #150e03 100%);
    box-shadow: inset 0 0 0 1px rgba(247, 224, 160, 0.08), 0 0 22px rgba(217, 172, 69, 0.18);
  }
  .btn--primary:hover {
    color: #120c02;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold));
    border-color: var(--gold-hi);
    box-shadow: 0 0 28px rgba(217, 172, 69, 0.4);
  }
  .btn--secondary {
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.7);
    background: transparent;
  }
  .btn--secondary:hover {
    color: var(--gold-hi);
    border-color: var(--gold);
    background: rgba(217, 172, 69, 0.08);
  }

  /* ---------- Gold light streaks (corners) ---------- */
  .streak {
    position: absolute;
    z-index: 1;
    height: 0.8vw;
    min-height: 7px;
    max-height: 14px;
    border-radius: 999px;
    pointer-events: none;
    background: linear-gradient(90deg,
      transparent 0%, var(--gold-deep) 12%, var(--gold-lo) 35%,
      var(--gold-hi) 55%, var(--gold) 78%, transparent 100%);
    box-shadow: 0 0 2.2vw rgba(217, 172, 69, 0.45);
    transform-origin: center;
    opacity: 0;
    animation: streak-in 1.1s ease-out 0.15s forwards;
  }
  .streak--thin {
    height: 0.25vw;
    min-height: 2px;
    max-height: 4px;
    box-shadow: 0 0 1.4vw rgba(247, 224, 160, 0.55);
  }

  /* top-left cluster */
  .streak--tl-1 { width: 46vw; left: -14vw; top: 5vw;  transform: rotate(-38deg); }
  .streak--tl-2 { width: 40vw; left: -12vw; top: 9vw;  transform: rotate(-38deg); }
  .streak--tl-3 { width: 52vw; left: -17vw; top: 7vw;  transform: rotate(-38deg); }

  /* bottom-right cluster */
  .streak--br-1 { width: 46vw; right: -14vw; bottom: 5vw; transform: rotate(-38deg); }
  .streak--br-2 { width: 40vw; right: -12vw; bottom: 9vw; transform: rotate(-38deg); }
  .streak--br-3 { width: 52vw; right: -17vw; bottom: 7vw; transform: rotate(-38deg); }

  @keyframes streak-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @media (max-width: 520px) {
    .btn { width: 100%; max-width: 20rem; }
    .streak { opacity: 0.85; }
  }

  @media (prefers-reduced-motion: reduce) {
    .streak { animation: none; opacity: 1; }
    .btn { transition: none; }
  }
</style>
</head>
